services:
  - type: web
    name: smartfactory-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMARTFACTORY_SECRET_KEY
        generateValue: true
      - key: SMARTFACTORY_ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:5173,http://127.0.0.1:5173
